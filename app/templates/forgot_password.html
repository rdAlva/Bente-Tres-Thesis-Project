{% extends "base.html" %}

{% block title %}Forgot Password — HAUdemicCheck{% endblock %}

{% block content %}

<div class="row justify-content-center auth-panel">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="text-center mb-4 auth-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="HAUdemicCheck logo"
                 width="150">

            <h1 class="h3 fw-bold mt-2">HAUdemicCheck</h1>
            <p class="text-muted small">
                Academic similarity detection system
            </p>
        </div>

        <div class="card shadow">
            <div class="card-header">
                <h2 class="h5 mb-0">Forgot Password</h2>
            </div>

            <div class="card-body p-4">
                <p class="text-muted small mb-4">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Send Reset Link
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-3 auth-footer-links">
            <a href="{{ url_for('login') }}" class="text-muted small">
                ← Back to Sign In
            </a>
        </div>
    </div>
</div>

{% endblock %}
