{% extends "base.html" %}

{% block title %}Reset Password — HAUdemicCheck{% endblock %}

{% block content %}

<div class="row justify-content-center auth-panel">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="text-center mb-4 auth-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="HAUdemicCheck logo"
                 width="150">

            <h1 class="h3 fw-bold mt-2">HAUdemicCheck</h1>
            <p class="text-muted small">
                Academic similarity detection system
            </p>
        </div>

        <div class="card shadow">
        <div class="card-header">
            <h2 class="h5 mb-0">Reset Password</h2>
        </div>

        <div class="card-body p-4">

            <p class="text-muted small mb-4">
                Enter your new password below.
            </p>

            <form method="POST" id="resetPasswordForm">

                <input type="hidden" name="access_token" id="access_token">
                <input type="hidden" name="refresh_token" id="refresh_token">

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                        New Password
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-password-toggle="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-semibold">
                        Confirm Password
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-password-toggle="confirm_password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit"
                            class="btn btn-primary btn-lg">
                        Reset Password
                    </button>
                </div>

            </form>

        </div>
    </div>

    <div class="text-center mt-3">
        <a href="{{ url_for('login') }}"
           class="text-muted small">
            ← Back to Sign In
        </a>
    </div>

{% endblock %}
